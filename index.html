        function SubTabEficiencia({ db, activeSem, listParticipantes, getPData, calcFinal }) {
            const aPA = Array.from({length: db.info.numPA}, (_, i) => i + 1);
            const aAct = Array.from({length: db.info.numAct}, (_, i) => i + 1);
            const aSes = Array.from({length: db.info.numSesiones || 0}, (_, i) => i + 1);
            const umbralAcreditacion = Number(db.info?.acreditacion ?? 80);

            const stats = useMemo(() => {
                const results = db.grupos.map(g => {
                    const ps = db.participantes.filter(p => p.grupoId === g.id);
                    const inscritos = ps.length;
                    const atendidos = ps.filter(p => getPData(p.id).conf).length;
                    const acreditados = ps.filter(p => calcFinal(p.id) >= umbralAcreditacion).length;

                    const paCounts = {};
                    for(let i=1; i<=db.info.numPA; i++) paCounts[i] = ps.filter(p => parseFloatSafe(getPData(p.id).paCal[i]) > 0).length;

                    const actCounts = {};
                    for(let i=1; i<=db.info.numAct; i++) actCounts[i] = ps.filter(p => parseFloatSafe(getPData(p.id).actCal[i]) > 0).length;

                    return { id: g.id, nombre: g.nombre, inscritos, atendidos, acreditados, paCounts, actCounts };
                });

                const sinPs = db.participantes.filter(p => !p.grupoId);
                if (sinPs.length > 0) {
                    const inscritos = sinPs.length;
                    const atendidos = sinPs.filter(p => getPData(p.id).conf).length;
                    const acreditados = sinPs.filter(p => calcFinal(p.id) >= umbralAcreditacion).length;
                    const paCounts = {};
                    for(let i=1; i<=db.info.numPA; i++) paCounts[i] = sinPs.filter(p => parseFloatSafe(getPData(p.id).paCal[i]) > 0).length;
                    const actCounts = {};
                    for(let i=1; i<=db.info.numAct; i++) actCounts[i] = sinPs.filter(p => parseFloatSafe(getPData(p.id).actCal[i]) > 0).length;
                    results.push({ id: 'NONE', nombre: 'Sin Asignar', inscritos, atendidos, acreditados, paCounts, actCounts });
                }
                return results;
            }, [db, getPData, calcFinal, umbralAcreditacion]);

            const total = useMemo(() => {
                const t = { nombre: 'Total ' + db.info.siglas, inscritos: 0, atendidos: 0, acreditados: 0, paCounts: {}, actCounts: {} };
                stats.forEach(s => {
                    t.inscritos += s.inscritos; t.atendidos += s.atendidos; t.acreditados += s.acreditados;
                    for(let i=1; i<=db.info.numPA; i++) t.paCounts[i] = (t.paCounts[i]||0) + s.paCounts[i];
                    for(let i=1; i<=db.info.numAct; i++) t.actCounts[i] = (t.actCounts[i]||0) + s.actCounts[i];
                });
                return t;
            }, [stats, db.info]);

            const chartColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#ec4899'];
            
            const labelsGrupos = stats.map(s => s.nombre);
            const dataGenGrupos = [
                { label: 'Inscritos', data: stats.map(s => s.inscritos), backgroundColor: '#cbd5e1' },
                { label: 'Atendidos', data: stats.map(s => s.atendidos), backgroundColor: '#3b82f6' },
                { label: 'Acreditados', data: stats.map(s => s.acreditados), backgroundColor: '#10b981' }
            ];

            const dataGenTotales = [{
                data: [total.inscritos - total.atendidos, total.atendidos - total.acreditados, total.acreditados],
                backgroundColor: ['#e2e8f0', '#93c5fd', '#34d399']
            }];
            const labelsGenTotales = ['Inscritos No Atendidos', 'Atendidos No Acreditados', 'Acreditados'];

            const dataActGrupos = [];
            let colorIdx = 0;
            aPA.forEach(i => {
                dataActGrupos.push({ label: `PA ${i} %`, data: stats.map(s => s.inscritos ? parseFloatSafe((s.paCounts[i]/s.inscritos*100).toFixed(1)) : 0), backgroundColor: chartColors[colorIdx++ % chartColors.length] });
            });
            aAct.forEach(i => {
                dataActGrupos.push({ label: `ACT ${i} %`, data: stats.map(s => s.inscritos ? parseFloatSafe((s.actCounts[i]/s.inscritos*100).toFixed(1)) : 0), backgroundColor: chartColors[colorIdx++ % chartColors.length] });
            });

            const labelsActTotales = [...aPA.map(i=>`PA ${i}`), ...aAct.map(i=>`ACT ${i}`)];
            const dataActTotales = [{
                label: '% de Entrega Global',
                data: [
                    ...aPA.map(i => total.inscritos ? parseFloatSafe((total.paCounts[i]/total.inscritos*100).toFixed(1)) : 0),
                    ...aAct.map(i => total.inscritos ? parseFloatSafe((total.actCounts[i]/total.inscritos*100).toFixed(1)) : 0)
                ],
                backgroundColor: '#8b5cf6'
            }];

            const labelsAsistencias = aSes.map(i => `S${i}`);
            const dataAsistencias = [{
                label: '% Asistencia',
                data: aSes.map(i => {
                    const asistencias = db.participantes.filter(p => !!getPData(p.id)?.asis?.[i]).length;
                    return total.inscritos ? parseFloatSafe((asistencias / total.inscritos * 100).toFixed(1)) : 0;
                }),
                backgroundColor: '#2563eb'
            }];

            const pctAcre = total.inscritos ? parseFloatSafe(((total.acreditados / total.inscritos) * 100).toFixed(2)) : 0;
            const pctNoAcre = total.inscritos ? parseFloatSafe((((total.inscritos - total.acreditados) / total.inscritos) * 100).toFixed(2)) : 0;
            
            const dataEfiGlobal = [{
                label: '% Eficiencia Terminal',
                data: [pctNoAcre, pctAcre],
                backgroundColor: ['#f87171', '#10b981']
            }];

            const cursoId = (db.info.idCurso || `${db.info.siglas || ''}${db.info.idEstado ? `-${db.info.idEstado}` : ''}`).trim();
            const chartTitleWithCurso = (baseTitle) => cursoId ? `${baseTitle} ${cursoId}` : baseTitle;

            return (
                <div className="p-8 bg-gray-50 flex-1 overflow-auto">
                    <div className="flex justify-between items-start mb-8 border-b border-gray-200 pb-6 bg-white p-6 rounded-2xl shadow-sm no-print">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-3">
                                <i className="fa-solid fa-chart-line text-blue-600"></i> Reportes de Eficiencia Terminal y Analíticas
                            </h2>
                            <p className="text-gray-500 mt-2">Cálculos basados en el estatus de la <strong>{activeSem.nombre}</strong></p>
                        </div>
                        <button onClick={()=>window.print()} className="bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg hover:bg-black font-bold flex items-center gap-3 transition-transform active:scale-95"><i className="fa-solid fa-print"></i> Imprimir Reporte</button>
                    </div>

                    <div className="space-y-8 max-w-7xl mx-auto print-only-container">
                        
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden break-inside-avoid">
                            <h3 className="font-bold text-gray-800 bg-gray-50 p-4 border-b border-gray-100 uppercase text-sm tracking-wider">Eficiencia Terminal General</h3>
                            <div className="overflow-x-auto p-4">
                                <table className="w-full text-xs text-center border-collapse">
                                    <thead className="bg-blue-50 text-blue-900">
                                        <tr>
                                            <th className="border p-3 text-left">Grupo</th>
                                            <th className="border p-3">Inscritos</th><th className="border p-3">Atendidos</th><th className="border p-3">Acreditados</th>
                                            <th className="border p-3">Eficiencia Terminal (Atendidos)</th><th className="border p-3">Eficiencia Terminal (Inscritos)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {stats.map(s => (
                                            <tr key={s.id} className="hover:bg-gray-50">
                                                <td className="border p-2 text-left font-bold">{s.nombre}</td>
                                                <td className="border p-2">{s.inscritos}</td><td className="border p-2">{s.atendidos}</td><td className="border p-2 font-bold text-green-600">{s.acreditados}</td>
                                                <td className="border p-2 font-bold text-blue-600">{formatPercent((s.acreditados/(s.atendidos||1))*100)}</td>
                                                <td className="border p-2 font-bold text-purple-600">{formatPercent((s.acreditados/(s.inscritos||1))*100)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot className="bg-gray-800 text-white font-bold">
                                        <tr>
                                            <td className="border p-3 text-left">{total.nombre}</td>
                                            <td className="border p-3">{total.inscritos}</td><td className="border p-3">{total.atendidos}</td><td className="border p-3 text-green-400">{total.acreditados}</td>
                                            <td className="border p-3 text-blue-300">{formatPercent((total.acreditados/(total.atendidos||1))*100)}</td>
                                            <td className="border p-3 text-purple-300">{formatPercent((total.acreditados/(total.inscritos||1))*100)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 break-inside-avoid">
                            <ChartCard type="bar" title={chartTitleWithCurso('Comparativa por Grupo (General)')} labels={labelsGrupos} datasets={dataGenGrupos} />
                            <ChartCard type="doughnut" title={chartTitleWithCurso('Distribución Global del Curso')} labels={labelsGenTotales} datasets={dataGenTotales} />
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden break-inside-avoid">
                            <h3 className="font-bold text-gray-800 bg-gray-50 p-4 border-b border-gray-100 uppercase text-sm tracking-wider">Eficiencia Terminal por Actividades</h3>
                            <div className="overflow-x-auto p-4">
                                <table className="w-full text-xs text-center border-collapse">
                                    <thead className="bg-purple-50 text-purple-900">
                                        <tr>
                                            <th className="border p-3 text-left">Grupo</th>
                                            {aPA.map(i => <th key={`th-pa-${i}`} className="border p-3">PA {i}</th>)}
                                            {aAct.map(i => <th key={`th-act-${i}`} className="border p-3">ACT {i}</th>)}
                                            <th className="border p-3">Acreditados</th><th className="border p-3">Eficiencia Terminal</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {stats.map(s => (
                                            <tr key={s.id} className="hover:bg-gray-50">
                                                <td className="border p-2 text-left font-bold">{s.nombre}</td>
                                                {aPA.map(i => <td key={`td-pa-${i}`} className="border p-2 text-gray-600">{formatPercent((s.paCounts[i]/(s.inscritos||1))*100)}</td>)}
                                                {aAct.map(i => <td key={`td-act-${i}`} className="border p-2 text-gray-600">{formatPercent((s.actCounts[i]/(s.inscritos||1))*100)}</td>)}
                                                <td className="border p-2 font-bold text-green-600">{s.acreditados}</td>
                                                <td className="border p-2 font-bold text-purple-600">{formatPercent((s.acreditados/(s.inscritos||1))*100)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot className="bg-gray-800 text-white font-bold">
                                        <tr>
                                            <td className="border p-3 text-left">{total.nombre}</td>
                                            {aPA.map(i => <td key={`tf-pa-${i}`} className="border p-3 text-gray-300">{formatPercent((total.paCounts[i]/(total.inscritos||1))*100)}</td>)}
                                            {aAct.map(i => <td key={`tf-act-${i}`} className="border p-3 text-gray-300">{formatPercent((total.actCounts[i]/(total.inscritos||1))*100)}</td>)}
                                            <td className="border p-3 text-green-400">{total.acreditados}</td>
                                            <td className="border p-3 text-purple-300">{formatPercent((total.acreditados/(total.inscritos||1))*100)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 break-inside-avoid">
                            <ChartCard type="bar" title={chartTitleWithCurso('Desempeño de Actividades por Grupo')} labels={labelsGrupos} datasets={dataActGrupos} />
                            <ChartCard type="bar" title={chartTitleWithCurso('Entregas Globales por Actividad (%)')} labels={labelsActTotales} datasets={dataActTotales} />
                        </div>

                        <div className="break-inside-avoid">
                            <ChartCard type="bar" title={chartTitleWithCurso('Asistencias')} labels={labelsAsistencias} datasets={dataAsistencias} />
                        </div>

                        <div className="break-inside-avoid">
                            <ChartCard type="pie" title={chartTitleWithCurso('Eficiencia Terminal General (% Inscritos)')} labels={['% No Acreditados', '% Acreditados']} datasets={dataEfiGlobal} />
                        </div>

                    </div>
                </div>
            );
        }

        // ==========================================
        // MACRO-MÓDULO: SEGUIMIENTO
        // ==========================================
        function TabSeguimiento({ db, onUpdate, isAsesor, isCoordinador, isAdmin, asesorGrupoId }) {
            const semanas = db.semanasSeguimiento || [];
            
            useEffect(() => {
                if (semanas.length === 0 && isAdmin) {
                    const inicial = { id: `sem-${Date.now()}`, nombre: 'Semana 1', fechas: '', corteDate: '', lockStatus: 'AUTO', data: {} };
                    onUpdate({ ...db, semanasSeguimiento: [inicial] });
                }
            }, []);

            const [activeSemId, setActiveSemId] = useState(semanas[0]?.id || null);
            const [subView, setSubView] = useState('matriz'); 
            
            const [showImport, setShowImport] = useState(false);
            const [importTarget, setImportTarget] = useState('masivo-estados'); 
            const [importText, setImportText] = useState('');
            const [showNewSemanaModal, setShowNewSemanaModal] = useState(false);
            const [newSemanaName, setNewSemanaName] = useState('');

            const [reportFilter, setReportFilter] = useState('ALL');
            const [reportFilterGrupo, setReportFilterGrupo] = useState('ALL');

            const [matrixFilterGrupo, setMatrixFilterGrupo] = useState('ALL');
            const [matrixFilterConf, setMatrixFilterConf] = useState('ALL');
            const [matrixFilterEstatus, setMatrixFilterEstatus] = useState('ALL');
            const [matrixFilterAvz, setMatrixFilterAvz] = useState('ALL');
            const [matrixSort, setMatrixSort] = useState({ type: 'none', dir: 'asc' });

            const umbralAcreditacion = Number(db.info?.acreditacion ?? 80);
            const activeSem = semanas.find(s => s.id === activeSemId);

            let isLockedForAsesor = false;
            if (activeSem) {
                if (activeSem.lockStatus === 'LOCKED') isLockedForAsesor = true;
                else if (activeSem.lockStatus === 'UNLOCKED') isLockedForAsesor = false;
                else { 
                    if (activeSem.corteDate) {
                        const cutOff = new Date(activeSem.corteDate + 'T23:59:59'); 
                        if (new Date() > cutOff) isLockedForAsesor = true;
                    }
                }
            }

            const canEditCore = isAdmin;
            const canEditManual = isAdmin || (isAsesor && !isLockedForAsesor); 

            const addSemana = () => {
                setNewSemanaName('Semana ' + (semanas.length + 1));
                setShowNewSemanaModal(true);
            };

            const guardarNuevaSemana = () => {
                const nombre = (newSemanaName || '').toString().trim();
                if (!nombre) return alert('Escribe un nombre para la semana.');
                const newSem = { id: `sem-${Date.now()}`, nombre, fechas: '', corteDate: '', lockStatus: 'AUTO', data: {} };
                if(activeSemId) {
                    const activeData = activeSem?.data;
                    if(activeData) newSem.data = JSON.parse(JSON.stringify(activeData));
                }
                onUpdate({ ...db, semanasSeguimiento: [...semanas, newSem] });
                setActiveSemId(newSem.id);
                setShowNewSemanaModal(false);
                setNewSemanaName('');
            };

            const renameSemana = () => {
                if(!activeSem) return;
                const newName = prompt("Ingresa el nuevo nombre para esta semana:", activeSem.nombre);
                if (newName && newName.trim()) {
                    const newSemanas = semanas.map(s => s.id === activeSem.id ? { ...s, nombre: newName.trim() } : s);
                    onUpdate({ ...db, semanasSeguimiento: newSemanas });
                }
            };

            const getPData = useCallback((pId) => {
                if(!activeSem || !activeSem.data[pId]) return { conf: false, asis: {}, paEst: {}, paCal: {}, actEst: {}, actCal: {}, encEst: false, encInst: false, msgGrp: false, msgPer: false, llam: false, obs: '' };
                return activeSem.data[pId];
            }, [activeSem]);

            const calcFinal = useCallback((pId) => {
                const d = getPData(pId);
                return calcularCalificacionFinal(d, db.info);
            }, [db.info, getPData]);

            const listParticipantes = useMemo(() => {
                let lista = db.participantes;
                
                if (isAsesor && asesorGrupoId) {
                    lista = lista.filter(p => p.grupoId === asesorGrupoId);
                } else {
                    if (matrixFilterGrupo !== 'ALL') {
                        if (matrixFilterGrupo === 'NONE') lista = lista.filter(p => !p.grupoId);
                        else lista = lista.filter(p => p.grupoId === matrixFilterGrupo);
                    }
                    if (matrixFilterConf !== 'ALL') {
                        lista = lista.filter(p => {
                            const d = getPData(p.id);
                            return matrixFilterConf === 'SI' ? d.conf : !d.conf;
                        });
                    }
                    if (matrixFilterEstatus !== 'ALL') {
                        lista = lista.filter(p => {
                            const status = calcFinal(p.id) >= umbralAcreditacion ? 'ACREDITADO' : 'NO ACREDITADO';
                            return status === matrixFilterEstatus;
                        });
                    }
                    if (matrixFilterAvz !== 'ALL') {
                        lista = lista.filter(p => {
                            const d = getPData(p.id);
                            if (matrixFilterAvz === 'PA_INC') return Array.from({length: db.info.numPA}, (_,i)=>i+1).some(i => !d.paEst[i]);
                            if (matrixFilterAvz === 'ACT_INC') return Array.from({length: db.info.numAct}, (_,i)=>i+1).some(i => !d.actEst[i]);
                            if (matrixFilterAvz === 'ASIS_INC') return Array.from({length: db.info.numSesiones}, (_,i)=>i+1).some(i => !d.asis[i]);
                            if (matrixFilterAvz === 'ENC_INC') return !d.encEst || !d.encInst;
                            return true;
                        });
                    }
                }

                return lista.sort((a,b) => {
                    if (!isAsesor && matrixSort.type !== 'none') {
                        if (matrixSort.type === 'calif') {
                            const calA = calcFinal(a.id);
                            const calB = calcFinal(b.id);
                            return matrixSort.dir === 'asc' ? calA - calB : calB - calA;
                        }
                        if (matrixSort.type === 'estatus') {
                            const statA = calcFinal(a.id) >= umbralAcreditacion ? 'ACREDITADO' : 'NO ACREDITADO';
                            const statB = calcFinal(b.id) >= umbralAcreditacion ? 'ACREDITADO' : 'NO ACREDITADO';
                            return matrixSort.dir === 'asc' ? statA.localeCompare(statB) : statB.localeCompare(statA);
                        }
                    }
                    const gA = (db.grupos.find(g=>g.id===a.grupoId)||{}).nombre||'';
                    const gB = (db.grupos.find(g=>g.id===b.grupoId)||{}).nombre||'';
                    return gA.localeCompare(gB) || a.completo.localeCompare(b.completo);
                });
            }, [db, isAsesor, asesorGrupoId, matrixFilterGrupo, matrixFilterConf, matrixFilterEstatus, matrixFilterAvz, matrixSort, getPData, calcFinal]);

            const reportParticipantes = useMemo(() => {
                let lista = db.participantes;
                if (isAsesor && asesorGrupoId) {
                    lista = lista.filter(p => p.grupoId === asesorGrupoId);
                } else if (!isAsesor) {
                    if (reportFilterGrupo !== 'ALL') {
                        if (reportFilterGrupo === 'NONE') lista = lista.filter(p => !p.grupoId);
                        else lista = lista.filter(p => p.grupoId === reportFilterGrupo);
                    }
                }
                return lista.sort((a,b) => {
                    const gA = (db.grupos.find(g=>g.id===a.grupoId)||{}).nombre||'';
                    const gB = (db.grupos.find(g=>g.id===b.grupoId)||{}).nombre||'';
                    return gA.localeCompare(gB) || a.completo.localeCompare(b.completo);
                });
            }, [db, isAsesor, asesorGrupoId, reportFilterGrupo]);

            const aSes = Array.from({length: db.info.numSesiones}, (_, i) => i + 1);
            const aPA = Array.from({length: db.info.numPA}, (_, i) => i + 1);
            const aAct = Array.from({length: db.info.numAct}, (_, i) => i + 1);

            const datosGlobales = useMemo(() => {
                const totalParticipantes = listParticipantes.length;
                const datos = listParticipantes.map(p => getPData(p.id));
                const totalAcreditados = listParticipantes.filter(p => calcFinal(p.id) >= umbralAcreditacion).length;
                const porcentajeAcreditados = totalParticipantes ? (totalAcreditados / totalParticipantes) * 100 : 0;

                const paStats = aPA.map(i => {
                    const entregas = datos.filter(d => d.paEst[i]).length;
                    const porRevisar = datos.filter(d => d.paEst[i] && parseFloatSafe(d.paCal[i]) === 0).length;
                    const calificado = datos.filter(d => parseFloatSafe(d.paCal[i]) > 0).length;
                    const faltantes = totalParticipantes - calificado;
                    const eficiencia = totalParticipantes ? Math.round((entregas / totalParticipantes) * 100) : 0;
                    return { entregas, porRevisar, calificado, faltantes, eficiencia };
                });

                const actStats = aAct.map(i => {
                    const entregas = datos.filter(d => d.actEst[i]).length;
                    const porRevisar = datos.filter(d => d.actEst[i] && parseFloatSafe(d.actCal[i]) === 0).length;
                    const calificado = datos.filter(d => parseFloatSafe(d.actCal[i]) > 0).length;
                    const faltantes = totalParticipantes - calificado;
                    const eficiencia = totalParticipantes ? Math.round((entregas / totalParticipantes) * 100) : 0;
                    return { entregas, porRevisar, calificado, faltantes, eficiencia };
                });

                return {
                    totalParticipantes,
                    totalAcreditados,
                    porcentajeAcreditados,
                    paStats,
                    actStats
                };
            }, [listParticipantes, aPA, aAct, getPData, calcFinal]);

            const updatePData = (pId, field, value, subField = null) => {
                if(!activeSem) return;
                const newData = { ...activeSem.data };
                if(!newData[pId]) newData[pId] = { conf: false, asis: {}, paEst: {}, paCal: {}, actEst: {}, actCal: {}, encEst: false, encInst: false, msgGrp: false, msgPer: false, llam: false, obs: '' };
                
                if (subField !== null) newData[pId][field] = { ...newData[pId][field], [subField]: value };
                else newData[pId][field] = value;
                
                const newSemanas = semanas.map(s => s.id === activeSem.id ? { ...s, data: newData } : s);
                onUpdate({ ...db, semanasSeguimiento: newSemanas });
            };

            const procesarImportacion = () => {
                if(!activeSem || !importText.trim()) return;
                
                const filas = importText.split('\n').filter(f => f.trim() !== '');
                if (filas.length < 2 && importTarget.startsWith('masivo')) return alert("Faltan datos o encabezados para la carga masiva.");

                let actualizados = 0;
                const newData = JSON.parse(JSON.stringify(activeSem.data || {}));
                const ensureP = (id) => { if(!newData[id]) newData[id] = { conf:false, asis:{}, paEst:{}, paCal:{}, actEst:{}, actCal:{}, encEst:false, encInst:false, msgGrp:false, msgPer:false, llam:false, obs:'' }; };

                if (importTarget === 'masivo-estados' || importTarget === 'masivo-calif') {
                    const headers = filas[0].split(/\t/).map(h => normalizeText(h));
                    const idxUsuario = headers.findIndex(h => h.includes('USUARIO') || h.includes('USERNAME') || h.includes('NOMBRE DE USUARIO'));
                    
                    if (idxUsuario === -1) return alert("Error: No se encontró la columna 'Usuario' en los encabezados pegados. Asegúrate de copiar la tabla completa desde Moodle.");

                    const mappings = [];
                    headers.forEach((h, idx) => {
                        const matchPA = h.match(/PRODUCTO DE APRENDIZAJE\s*(\d+)/);
                        if (matchPA) mappings.push({ type: importTarget === 'masivo-estados' ? 'paEst' : 'paCal', num: parseInt(matchPA[1]), colIdx: idx });
                        
                        const matchAct = h.match(/ACTIVIDAD\s*(\d+)/);
                        if (matchAct) mappings.push({ type: importTarget === 'masivo-estados' ? 'actEst' : 'actCal', num: parseInt(matchAct[1]), colIdx: idx });
                    });

                    if (mappings.length === 0) return alert("No se detectaron columnas de 'Producto de Aprendizaje' o 'Actividad' en los encabezados pegados.");

                    let alumnosEncontrados = 0;
                    filas.slice(1).forEach(fila => {
                        const cols = fila.split(/\t/);
                        if (cols.length > idxUsuario) {
                            const user = getMoodleUsername(cols[idxUsuario].trim());
                            const p = db.participantes.find(x => getMoodleUsername(x.curp) === user);
                            if (p) {
                                ensureP(p.id);
                                alumnosEncontrados++;
                                mappings.forEach(map => {
                                    const val = cols[map.colIdx] ? cols[map.colIdx].trim() : '';
                                    if (importTarget === 'masivo-estados') {
                                        const normalizedVal = normalizeText(val);
                                        const isFinalizado = normalizedVal.includes('FINALIZADO') && !normalizedVal.includes('NO FINALIZADO');
                                        newData[p.id][map.type][map.num] = isFinalizado;
                                    } else {
                                        newData[p.id][map.type][map.num] = parseFloatSafe(val);
                                    }
                                });
                            }
                        }
                    });
                    alert(`Importación Masiva Exitosa.\nSe detectaron ${mappings.length} columnas de actividades.\nSe actualizaron los datos de ${alumnosEncontrados} participantes.`);
                } else if (importTarget.includes('Cal')) {
                    filas.forEach(fila => {
                        const cols = fila.split(/[\t,;]/); 
                        if(cols.length >= 2) {
                            const user = getMoodleUsername(cols[0].trim());
                            const p = db.participantes.find(x => getMoodleUsername(x.curp) === user);
                            if(p) {
                                ensureP(p.id);
                                const calif = parseFloatSafe(cols[1]);
                                const [tipo, num] = importTarget.split('-');
                                newData[p.id][tipo][num] = calif;
                                actualizados++;
                            }
                        }
                    });
                    alert(`Importación individual exitosa. ${actualizados} registros actualizados.`);
                } else {
                    filas.forEach(val => {
                        const idBuscado = normalizeText(val);
                        const userBuscado = getMoodleUsername(val);
                        const p = db.participantes.find(x => (importTarget.startsWith('asis') ? x.curp === idBuscado : getMoodleUsername(x.curp) === userBuscado));
                        if(p) {
                            ensureP(p.id);
                            if(importTarget === 'conf') newData[p.id].conf = true;
                            else if(importTarget === 'encEst') newData[p.id].encEst = true;
                            else if(importTarget === 'encInst') newData[p.id].encInst = true;
                            else {
                                const [tipo, num] = importTarget.split('-');
                                newData[p.id][tipo][num] = true; 
                            }
                            actualizados++;
                        }
                    });
                    alert(`Importación individual exitosa. ${actualizados} registros actualizados.`);
                }
                const newSemanas = semanas.map(s => s.id === activeSem.id ? { ...s, data: newData } : s);
                onUpdate({ ...db, semanasSeguimiento: newSemanas });
                setShowImport(false); setImportText('');
            };

            const exportarSeguimientoCSV = () => {
                if(!activeSem) return;
                
                let headers = ['No', 'CURP', 'Nombre Completo', 'Usuario', 'Correo', 'Asesor', 'Grupo', 'Confirmacion'];
                for(let i=1; i<=db.info.numSesiones; i++) headers.push(`Asistencia S${i}`);
                for(let i=1; i<=db.info.numPA; i++) { headers.push(`PA ${i} Estado`); headers.push(`PA ${i} Calif`); }
                for(let i=1; i<=db.info.numAct; i++) { headers.push(`ACT ${i} Estado`); headers.push(`ACT ${i} Calif`); }
                headers.push('Calif Final', 'Estatus', 'Encuesta Estatal', 'Encuesta Institucional', 'Mensaje Grupo', 'Mensaje Personal', 'Llamada', 'Observaciones');

                const rows = listParticipantes.map((p, idx) => {
                    const d = getPData(p.id);
                    const g = db.grupos.find(x=>x.id===p.grupoId)||{};
                    const calFinal = calcFinal(p.id);
                    const status = calFinal >= 80 ? 'ACREDITADO' : 'NO ACREDITADO';

                    let row = [
                        idx+1, p.curp, p.completo, getMoodleUsername(p.curp), p.correo, g.asesor||'-', g.nombre||'-', d.conf?'SI':'NO'
                    ];
                    
                    for(let i=1; i<=db.info.numSesiones; i++) row.push(d.asis[i]?'SI':'NO');
                    for(let i=1; i<=db.info.numPA; i++) { row.push(d.paEst[i]?'Finalizado':'No Finalizado'); row.push(d.paCal[i]||0); }
                    for(let i=1; i<=db.info.numAct; i++) { row.push(d.actEst[i]?'Finalizado':'No Finalizado'); row.push(d.actCal[i]||0); }
                    
                    row.push(calFinal, status, d.encEst?'SI':'NO', d.encInst?'SI':'NO', d.msgGrp?'SI':'NO', d.msgPer?'SI':'NO', d.llam?'SI':'NO', d.obs||'');

                    return row.map(v => `"${(v||'').toString().replace(/"/g, '""')}"`).join(',');
                });

                const csvData = [headers.join(','), ...rows].join('\n');
                downloadCSV(`Seguimiento_${activeSem.nombre}_${db.info.siglas}.csv`, csvData);
            };

            if (!activeSem) return <div className="p-10 text-center">Sin semanas creadas.</div>;

            if (subView === 'eficiencia' && (isAdmin || isCoordinador)) {
                return (
                    <div className="flex flex-col h-full bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                        <div className="bg-gray-800 text-white p-4 flex justify-between items-center no-print">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-gray-300 uppercase tracking-wider text-xs mr-2">Ciclo Operativo:</span>
                                <select className="bg-gray-700 text-white border border-gray-600 rounded-lg p-2 text-sm outline-none focus:border-cyan-400 font-bold" value={activeSemId} onChange={e=>setActiveSemId(e.target.value)}>
                                    {semanas.map(s => <option key={s.id} value={s.id}>{s.nombre}</option>)}
                                </select>
                            </div>
                            <div className="flex gap-2 p-1 bg-gray-900 rounded-xl">
                                <button onClick={()=>setSubView('matriz')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors text-gray-400 hover:text-white hover:bg-gray-700`}><i className="fa-solid fa-table-cells mr-1"></i> Matriz Principal</button>
                                <button onClick={()=>setSubView('faltantes')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors text-gray-400 hover:text-white hover:bg-gray-700`}><i className="fa-solid fa-file-signature mr-1"></i> Por Revisar</button>
                                <button onClick={()=>setSubView('seguimiento')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors text-gray-400 hover:text-white hover:bg-gray-700`}><i className="fa-solid fa-triangle-exclamation mr-1"></i> Alerta</button>
                                <button onClick={()=>setSubView('eficiencia')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors bg-blue-600 shadow text-white`}><i className="fa-solid fa-chart-line mr-1"></i> Eficiencia y Gráficas</button>
                            </div>
                        </div>
                        <SubTabEficiencia db={db} activeSem={activeSem} listParticipantes={db.participantes} getPData={getPData} calcFinal={calcFinal} />
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                    <div className="bg-gray-800 text-white p-4 flex justify-between items-center no-print">
                        <div className="flex items-center gap-2">
                            <span className="font-bold text-gray-300 uppercase tracking-wider text-xs mr-2">Ciclo Operativo:</span>
                            <select className="bg-gray-700 text-white border border-gray-600 rounded-lg p-2 text-sm outline-none focus:border-cyan-400 font-bold" value={activeSemId} onChange={e=>setActiveSemId(e.target.value)}>
                                {semanas.map(s => <option key={s.id} value={s.id}>{s.nombre}</option>)}
                            </select>

                                    <p className="text-gray-500 mt-2">{subView === 'faltantes' ? 'Participantes que ya entregaron pero su calificación es 0.' : 'Participantes que no tienen estado Finalizado y su calificación es 0.'}</p>
                                    
                                    <div className="mt-6 flex flex-wrap items-center gap-4 no-print bg-gray-50 p-3 rounded-lg border border-gray-100 inline-flex">
                                        <div className="flex items-center gap-2">
                                            <label className="text-sm font-bold text-gray-700 uppercase tracking-wide text-xs"><i className="fa-solid fa-filter text-blue-500 mr-1"></i> Filtrar Actividad:</label>
                                            <select className="border border-gray-300 rounded-lg p-2 text-sm shadow-sm outline-none focus:border-blue-500 bg-white" value={reportFilter} onChange={e=>setReportFilter(e.target.value)}>
                                                <option value="ALL">Todas las actividades del curso</option>
                                                {aPA.map(i => <option key={`fpa-${i}`} value={`PA-${i}`}>Producto de Aprendizaje {i}</option>)}
                                                {aAct.map(i => <option key={`fact-${i}`} value={`ACT-${i}`}>Actividad {i}</option>)}
                                            </select>
                                        </div>
                                        {!isAsesor && (
                                            <div className="flex items-center gap-2 border-l border-gray-300 pl-4">
                                                <label className="text-sm font-bold text-gray-700 uppercase tracking-wide text-xs"><i className="fa-solid fa-users text-blue-500 mr-1"></i> Filtrar Grupo:</label>
                                                <select className="border border-gray-300 rounded-lg p-2 text-sm shadow-sm outline-none focus:border-blue-500 bg-white" value={reportFilterGrupo} onChange={e=>setReportFilterGrupo(e.target.value)}>
                                                    <option value="ALL">Todos los Grupos</option>
                                                    <option value="NONE">Sin Grupo</option>
                                                    {db.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre}</option>)}
                                                </select>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <button onClick={()=>window.print()} className="bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg hover:bg-black font-bold flex items-center gap-3 transition-transform active:scale-95"><i className="fa-solid fa-print"></i> Imprimir Reporte</button>
                            </div>
                            
                            <div className="space-y-8 print-only max-w-5xl mx-auto">
                                {aPA.map(i => {
                                    if (reportFilter !== 'ALL' && reportFilter !== `PA-${i}`) return null;
                                    const title = `Producto de Aprendizaje ${i}`;
                                    const records = reportParticipantes.filter(p => {
                                        const d = getPData(p.id);
                                        const est = d.paEst[i]; const cal = parseFloatSafe(d.paCal[i]);
                                        if (subView === 'faltantes') return est === true && cal === 0;
                                        return est !== true && cal === 0;
                                    });
                                    if(records.length===0) return null;
                                    return <ReportTable key={`rep-pa-${i}`} title={title} records={records} db={db} />
                                })}
                                {aAct.map(i => {
                                    if (reportFilter !== 'ALL' && reportFilter !== `ACT-${i}`) return null;
                                    const title = `Actividad ${i}`;
                                    const records = reportParticipantes.filter(p => {
                                        const d = getPData(p.id);
                                        const est = d.actEst[i]; const cal = parseFloatSafe(d.actCal[i]);
                                        if (subView === 'faltantes') return est === true && cal === 0;
                                        return est !== true && cal === 0;
                                    });
                                    if(records.length===0) return null;
                                    return <ReportTable key={`rep-act-${i}`} title={title} records={records} db={db} />
                                })}
                                
                                {((reportFilter === 'ALL' && 
                                    !aPA.some(i => reportParticipantes.some(p => subView==='faltantes' ? (getPData(p.id).paEst[i]===true && parseFloatSafe(getPData(p.id).paCal[i])===0) : (getPData(p.id).paEst[i]!==true && parseFloatSafe(getPData(p.id).paCal[i])===0))) && 
                                    !aAct.some(i => reportParticipantes.some(p => subView==='faltantes' ? (getPData(p.id).actEst[i]===true && parseFloatSafe(getPData(p.id).actCal[i])===0) : (getPData(p.id).actEst[i]!==true && parseFloatSafe(getPData(p.id).actCal[i])===0)))) || 
                                  (reportFilter !== 'ALL' && 
                                    (reportFilter.startsWith('PA-') && !reportParticipantes.some(p => { const i = parseInt(reportFilter.split('-')[1]); return subView==='faltantes' ? (getPData(p.id).paEst[i]===true && parseFloatSafe(getPData(p.id).paCal[i])===0) : (getPData(p.id).paEst[i]!==true && parseFloatSafe(getPData(p.id).paCal[i])===0); })) ||
                                    (reportFilter.startsWith('ACT-') && !reportParticipantes.some(p => { const i = parseInt(reportFilter.split('-')[1]); return subView==='faltantes' ? (getPData(p.id).actEst[i]===true && parseFloatSafe(getPData(p.id).actCal[i])===0) : (getPData(p.id).actEst[i]!==true && parseFloatSafe(getPData(p.id).actCal[i])===0); }))
                                  )) && (
                                    <div className="text-center p-16 bg-white rounded-3xl shadow-sm border border-gray-100 no-print">
                                        <div className="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                                            <i className="fa-solid fa-check text-5xl text-green-500"></i>
                                        </div>
                                        <h3 className="text-2xl font-bold text-gray-800 mb-2">¡Todo al corriente!</h3>
                                        <p className="text-gray-500 text-lg">No hay registros de alumnos atrasados que coincidan con este filtro actualmente.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {showNewSemanaModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowNewSemanaModal(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-[520px] max-w-full flex flex-col overflow-hidden">
                                <div className="p-5 flex justify-between items-center border-b border-gray-100">
                                    <h2 className="font-bold text-lg text-gray-800 flex items-center gap-3"><i className="fa-solid fa-calendar-plus text-cyan-600"></i> Nueva Semana</h2>
                                    <button onClick={() => setShowNewSemanaModal(false)} className="text-gray-400 hover:text-red-500 transition-colors"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="p-6">
                                    <label className="block text-xs font-bold text-gray-700 mb-2 uppercase tracking-wide">Nombre de la Semana</label>
                                    <input className="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-cyan-300" value={newSemanaName} onChange={e => setNewSemanaName(e.target.value)} placeholder="Semana 2, Acreditados, etc." />
                                    <p className="text-sm text-gray-400 mt-3">Si dejas el nombre por defecto, se creará como "Semana {semanas.length + 1}".</p>
                                </div>
                                <div className="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                                    <button onClick={() => setShowNewSemanaModal(false)} className="px-5 py-2 rounded-xl text-gray-600 font-bold hover:bg-gray-200 transition-colors">Cancelar</button>
                                    <button onClick={guardarNuevaSemana} className="px-5 py-2 rounded-xl bg-cyan-600 text-white font-bold hover:bg-cyan-700 shadow">Crear semana</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showImport && isAdmin && (
                        <div className="fixed inset-0 bg-blue-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-[700px] max-w-full flex flex-col max-h-[90vh] overflow-hidden">
                                <div className="p-5 flex justify-between items-center bg-gray-50 border-b border-gray-200">
                                    <h2 className="font-bold text-xl text-gray-800 flex items-center gap-3"><i className="fa-solid fa-wand-magic-sparkles text-blue-600"></i> Carga Rápida Moodle</h2>
                                    <button onClick={()=>setShowImport(false)} className="text-gray-400 hover:text-red-500 transition-colors"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="p-6 overflow-auto flex-1">
                                    <div className="bg-green-50 p-4 rounded-xl border border-green-100 mb-6 flex gap-3 text-green-800">
                                        <i className="fa-solid fa-bolt mt-1 text-green-600"></i>
                                        <p className="text-sm"><strong>¡NUEVO IMPORTADOR MASIVO!</strong> Ahora puedes pegar la tabla completa que descargas de Moodle (incluyendo los títulos de las columnas). El sistema buscará "Usuario" y cruzará <strong>todas</strong> las actividades o calificaciones automáticamente.</p>
                                    </div>
                                    
                                    <label className="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider text-xs">Destino de la Información</label>
                                    <select className="w-full p-3.5 border border-gray-300 rounded-xl mb-6 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow" value={importTarget} onChange={e=>setImportTarget(e.target.value)}>
                                        <optgroup label="¡NUEVO! Importación Masiva Inteligente (Moodle Completo)">
                                            <option value="masivo-estados">Todos los Estados de Entrega (Busca automáticamente todas las PA y Actividades)</option>
                                            <option value="masivo-calif">Todas las Calificaciones (Convierte guiones a 0 automáticamente)</option>
                                        </optgroup>
                                        <optgroup label="Opciones Manuales / Individuales">
                                            <option value="conf">Confirmación (Requiere 1 Columna: Usuarios o CURP)</option>
                                            {aSes.map(i => <option key={`oi-a-${i}`} value={`asis-${i}`}>Asistencia Sesión {i} (Requiere 1 Columna: CURPs o Usuarios)</option>)}
                                        </optgroup>
                                    </select>

                                    <label className="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider text-xs">
                                        {importTarget.startsWith('masivo') ? 'Pega la tabla completa de Excel (incluyendo Fila de Títulos)' : 'Pega la lista de datos aquí'}
                                    </label>
                                    <textarea className="w-full h-48 p-4 border border-gray-300 rounded-xl font-mono text-sm whitespace-pre bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none shadow-inner transition-colors" placeholder={importTarget.startsWith('masivo') ? "Usuario\tDirección Email\tProducto de Aprendizaje 1\tActividad 1...\nusuario_1\tcorreo@x.com\nFinalizado\tNo Finalizado..." : "usuario123\nusuario456..."} value={importText} onChange={e=>setImportText(e.target.value)}></textarea>
                                </div>
                                <div className="p-5 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                                    <button onClick={()=>setShowImport(false)} className="px-6 py-3 rounded-xl text-gray-600 font-bold hover:bg-gray-200 transition-colors">Cancelar</button>
                                    <button onClick={procesarImportacion} className="px-6 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-lg shadow-blue-500/30 flex items-center gap-2 transition-transform active:scale-95"><i className="fa-solid fa-play"></i> Procesar Datos</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ReportTable({ title, records, db }) {
            return (
                <div className="mb-8 bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm break-inside-avoid">
                    <h3 className="font-bold text-gray-800 bg-gray-50 p-4 border-b border-gray-100 uppercase text-sm flex justify-between items-center tracking-wider">
                        {title} 
                        <span className="text-xs bg-blue-100 text-blue-800 font-black px-3 py-1 rounded-full">{records.length} registros</span>
                    </h3>
                    <table className="w-full text-sm text-left border-collapse">
                        <thead className="bg-white text-gray-400 text-xs">
                            <tr><th className="border-b border-gray-100 p-4 font-bold uppercase">Nombre Completo</th><th className="border-b border-gray-100 p-4 font-bold uppercase w-40">Grupo</th><th className="border-b border-gray-100 p-4 font-bold uppercase w-64">Asesor Titular</th></tr>
                        </thead>
                        <tbody>
                            {records.map(p => {
                                const g = db.grupos.find(x=>x.id===p.grupoId)||{};
                                return (
                                    <tr key={`rt-${p.id}`} className="border-b border-gray-50 hover:bg-gray-50/80 transition-colors">
                                        <td className="p-4 font-semibold text-gray-800">{p.completo}</td><td className="p-4 font-bold text-blue-600">{g.nombre||'-'}</td><td className="p-4 text-gray-500">{g.asesor||'-'}</td>
                                    </tr>
                                )
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
