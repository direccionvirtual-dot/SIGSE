    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AlzaSyDgBLCN2QP-mHQvNe0t9e_HmmuyJorRkUM",
            authDomain: "prodep-gestion.firebaseapp.com",

        const firebaseDb = firebaseApp ? firebase.firestore() : null;
        const firebaseEnabled = !!firebaseDb;
        const remoteStateDoc = firebaseDb ? firebaseDb.collection('prodep_app').doc('app_state') : null;

        const saveRemoteState = async (updates) => {
            if (!firebaseEnabled) return;
            try {
                await remoteStateDoc.set({
                    ...updates,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (error) {
                console.warn('Firebase: no se pudo guardar el estado remoto.', error);
            }
        };

        const loadRemoteState = async () => {
            if (!firebaseEnabled) return null;
            try {
                const snap = await remoteStateDoc.get();
                return snap.exists ? snap.data() : null;
            } catch (error) {
                console.warn('Firebase: no se pudo cargar el estado remoto.', error);
                return null;
            }
        };

        function useFirestoreState(key, initialValue) {
            const [storedValue, setStoredValue] = useState(initialValue);

            useEffect(() => {
                let isMounted = true;

                const load = async () => {
                    if (!firebaseEnabled) return;
                    try {
                        const remote = await loadRemoteState();
                        if (!isMounted || !remote) return;
                        if (key === 'prodep_dbs' && Array.isArray(remote.basesDeDatos)) {
                            setStoredValue(remote.basesDeDatos);
                        }
                        if (key === 'prodep_asesores_global' && Array.isArray(remote.personalGlobal)) {
                            setStoredValue(remote.personalGlobal);
                        }
                        if (key === 'prodep_admins' && Array.isArray(remote.adminUsers)) {
                            setStoredValue(remote.adminUsers);
                        }
                    } catch (error) {
                        console.warn('Firebase: no se pudo inicializar el estado.', error);
                    }
                };

                load();
                return () => { isMounted = false; };
            }, [key]);

            const setValue = value => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    if (firebaseEnabled) {
                        if (key === 'prodep_dbs') {
                            saveRemoteState({ basesDeDatos: valueToStore });
                        }
                        if (key === 'prodep_asesores_global') {
                            saveRemoteState({ personalGlobal: valueToStore });
                        }
                        if (key === 'prodep_admins') {
                            saveRemoteState({ adminUsers: valueToStore });
                        }
                    }
                } catch (error) {
                    console.error(error);
                }
            };

            return [storedValue, setValue];
        }

        // --- CATÁLOGOS Y CONSTANTES ---
        const ESTADOS = [
            { nombre: "Aguascalientes", id: "AGS" }, { nombre: "Baja California", id: "BC" },

            { nombre: "Ciudad de Mexico", id: "CDMX" }, { nombre: "Coahuila", id: "COA" },

            { nombre: "Estado de Mexico", id: "EMEX" }, { nombre: "Guanajuato", id: "GTO" },
            { nombre: "Guerrero", id: "GRO" }, { nombre: "Hidalgo", id: "HGO" },
            { nombre: "Jalisco", id: "JAL" }, { nombre: "Michoacan", id: "MIC" },
            { nombre: "Morelos", id: "MOR" }, { nombre: "Nayarit", id: "NAY" },
            { nombre: "Nuevo Leon", id: "NLE" }, { nombre: "Oaxaca", id: "OAX" },
            { nombre: "Puebla", id: "PUE" }, { nombre: "Queretaro", id: "QRO" },
            { nombre: "Quintana Roo", id: "ROO" }, { nombre: "San Luis Potosi", id: "SLP" },
            { nombre: "Sinaloa", id: "SIN" }, { nombre: "Sonora", id: "SON" },
            { nombre: "Tabasco", id: "TAB" }, { nombre: "Tamaulipas", id: "TAM" },
            { nombre: "Tlaxcala", id: "TLA" }, { nombre: "Veracruz", id: "VER" },
            { nombre: "Yucatan", id: "YUC" }, { nombre: "Zacatecas", id: "ZAC" }

        const TIPOS_FORMACION = ["Curso", "Diplomado", "Taller", "Seminario", "Tertulia pedagógica o dialógica", "Grupo de análisis de la práctica", "Encuentro", "Jornada"];
        const SECTORES_FORMATIVOS = ["Educación Continua", "PRODEP", "Formadores", "Otros"];

        // --- FUNCIONES AUXILIARES ---
        const normalizeText = (text) => text ? text.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : '';
        const getMoodleUsername = (curp) => curp ? curp.substring(0, 10).toLowerCase() : '';
        const copyToClipboard = (text) => {
            const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); alert('¡Copiado!'); } catch (err) { alert('Error al copiar'); }
            document.body.removeChild(t);
        };
        const downloadCSV = (filename, csvData) => {
            const blob = new Blob(["\uFEFF" + csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = filename;
            link.style.visibility = 'hidden'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };
        const parseFloatSafe = (val) => {
            if(!val) return 0;
            const s = val.toString().replace(/"/g, '').trim();
            if(s === '-' || s === '') return 0;
            const parsed = parseFloat(s);
            return isNaN(parsed) ? 0 : parsed;
        };
        const getCalculoFinalTipo = (info) => info?.calculoFinalTipo || 'sumatoria';
        const calcularCalificacionFinal = (data, info) => {
            const numPA = Number(info?.numPA || 0);
            const numAct = Number(info?.numAct || 0);
            const scores = [];

            for(let i=1; i<=numPA; i++) scores.push(parseFloatSafe(data?.paCal?.[i] || 0));
            for(let i=1; i<=numAct; i++) scores.push(parseFloatSafe(data?.actCal?.[i] || 0));

            if (getCalculoFinalTipo(info) === 'promedio') {
                const totalItems = scores.length;
                return totalItems ? scores.reduce((sum, v) => sum + v, 0) / totalItems : 0;
            }

            return scores.reduce((sum, v) => sum + v, 0);
        };
        const formatPercent = (val) => {
            if(isNaN(val) || !isFinite(val)) return '0%';
            return `${Math.round(val)}%`;
        };

        // ==========================================
        // COMPONENTE GENÉRICO DE GRÁFICAS 
        // ==========================================
        function ChartCard({ type, labels, datasets, title }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if(!canvasRef.current) return;
                if(chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(canvasRef.current, {
                    type: type,
                    data: { labels, datasets },
                    options: {
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: { 
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15, font: {size: 10} } },
                            tooltip: { 
                                callbacks: { 
                                    label: function(context) { 
                                        let label = context.dataset.label || ''; 
                                        if (label) { label += ': '; } 
                                        if (context.parsed.y !== null) { label += context.parsed.y; } 
                                        else if (context.parsed !== null) { label += context.parsed; }
                                        
                                        const labelTitle = title.toLowerCase();
                                        if (label.includes('%') || labelTitle.includes('%') || labelTitle.includes('eficiencia')) {
                                            if (!label.endsWith('%')) label += '%';
                                        }
                                        return label; 
                                    } 
                                } 
                            },
                            datalabels: {
                                display: true,
                                color: (context) => {
                                    if (type === 'pie' || type === 'doughnut') return '#ffffff';
                                    return '#1e293b'; 
                                },
                                font: { weight: 'bold', size: 10 },
                                anchor: (context) => (type === 'pie' || type === 'doughnut') ? 'center' : 'end',
                                align: (context) => (type === 'pie' || type === 'doughnut') ? 'center' : 'top',
                                offset: 2,
                                formatter: (value, context) => {
                                    const valNum = parseFloatSafe(value);
                                    if (valNum === 0) return ''; 
                                    const datasetLabel = context.dataset.label || '';
                                    const labelTitle = title.toLowerCase();
                                    const isPercentage = datasetLabel.includes('%') || labelTitle.includes('%') || labelTitle.includes('eficiencia');
                                    return isPercentage ? valNum + '%' : valNum;
                                }
                            }
                        },
                        scales: type === 'pie' || type === 'doughnut' ? {} : {
                            y: {
                                beginAtZero: true,
                                min: 0,
                                max: 100,
                                grace: '12%',
                                ticks: { font: {size: 10} }
                            },
                            x: { ticks: { font: {size: 10}, autoSkip: false, maxRotation: 45, minRotation: 45 } }
                        }
                    },
                    plugins: [{
                        id: 'customCanvasBackgroundColor',
                        beforeDraw: (chart, args, options) => {
                            const {ctx} = chart;
                            ctx.save();
                            ctx.globalCompositeOperation = 'destination-over';
                            ctx.fillStyle = options.color || '#ffffff';
                            ctx.fillRect(0, 0, chart.width, chart.height);
                            ctx.restore();
                        }
                    }]
                });

                return () => { if(chartRef.current) chartRef.current.destroy(); }
            }, [type, labels, datasets]);

            const copyImage = () => {
                const canvas = canvasRef.current;
                canvas.toBlob(blob => {
                    if(navigator.clipboard && navigator.clipboard.write) {
                        navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(()=>alert("Gráfica copiada al portapapeles. ¡Lista para pegar en tus informes!")).catch(e => alert("Tu navegador bloqueó el pegado directo. Usa el botón de Descargar PNG."));
                    } else { alert("Tu navegador no soporta copiado directo. Usa Descargar."); }
                });
            };
            
            const downloadImage = () => {
                const link = document.createElement('a');
                link.download = `${title.replace(/ /g, '_')}.png`;
                link.href = canvasRef.current.toDataURL('image/png', 1.0);
                link.click();
            };

            return (
                <div className="bg-white border border-gray-200 rounded-xl shadow-sm p-5 h-full flex flex-col break-inside-avoid">
                    <div className="flex justify-between items-start mb-4 border-b pb-2">
                        <h3 className="font-bold text-gray-800 text-sm">{title}</h3>
                        <div className="flex gap-2 no-print">
                            <button onClick={copyImage} className="text-gray-400 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 p-2 rounded-lg transition-colors" title="Copiar al portapapeles"><i className="fa-solid fa-copy"></i></button>
                            <button onClick={downloadImage} className="text-gray-400 hover:text-green-600 bg-gray-50 hover:bg-green-50 p-2 rounded-lg transition-colors" title="Descargar como PNG"><i className="fa-solid fa-download"></i></button>
                        </div>
                    </div>
                    <div className="flex-1 min-h-[300px] w-full relative">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENTE PRINCIPAL
        // ==========================================
        function App() {

            useEffect(() => {
                const est = ESTADOS.find(e => e.nombre === estadoSeleccionado);

            }, [estadoSeleccionado]);

            useEffect(() => {
                const checkFirebaseConnection = async () => {
                    if (!firebaseEnabled) {
                        setFirebaseStatus('failed');

                        return;
                    }
                    try {
                        await remoteStateDoc.get();
                        setFirebaseStatus('connected');

                    } catch (error) {
                        setFirebaseStatus('failed');
                        setFirebaseStatusMessage('Error al conectar con Firebase: ' + (error.message || 'Revisa tu red.'));
                    }
                };
                checkFirebaseConnection();
            }, []);

            // Plantilla Base
            const descargarPlantillaBase = () => {
                if (typeof XLSX === 'undefined') return alert("Cargando librerías de Excel... intenta en un segundo.");
                const headers = [
                    'NO. CONSECUTIVO', 'CORREO ELECTRONICO', 'RFC', 'CURP', 'EDAD', 'SEXO', 
                    'NOMBRE', 'APELLIDO PATERNO', 'APELLIDO MATERNO', 'TELEFONO', 
                    'CLAVE CENTRO DE TRABAJO', 'SUBSISTEMA', 'MUNICIPIO', 'FUNCION', 
                    'NIVEL EDUCATIVO', 'SERVICIO MODALIDAD', 'FOLIO', 'CURSO CONCLUIDO'
                ];
                const ws = XLSX.utils.aoa_to_sheet([headers]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Plantilla_SIGSE");
                XLSX.writeFile(wb, "Plantilla_Base_SIGSE.xlsx");
            };

            // Parseo Robusto Reparado
            const procesarTextoPegado = (texto) => {
                setTextoPegado(texto);
                if (!texto.trim()) { setParticipantesProcesados([]); return; }
                
                const filasOriginales = texto.split(/\r?\n/).filter(f => f.trim() !== '');
                if (filasOriginales.length < 2) { setParticipantesProcesados([]); return; }
                
                let headerIdx = 0;
                for (let i = 0; i < Math.min(filasOriginales.length, 20); i++) {
                    const rowNorm = normalizeText(filasOriginales[i]);
                    if (rowNorm.includes('NOMBRE') && rowNorm.includes('CURP')) {
                        headerIdx = i;
                        break;
                    }
                }
                
                const filas = filasOriginales.slice(headerIdx);
                const cabeceras = filas[0].split('\t').map(c => normalizeText(c));
                const findCol = (kw) => cabeceras.findIndex(cab => kw.some(k => cab.includes(k)));

                const mapIndices = {
                    no: findCol(['NO.', 'NUMERO', 'CONSECUTIVO']), correo: findCol(['CORREO', 'EMAIL']), rfc: findCol(['RFC']),
                    curp: findCol(['CURP']), edad: findCol(['EDAD']), sexo: findCol(['SEXO', 'GENERO']), nombre: findCol(['NOMBRE']),
                    paterno: findCol(['PATERNO', 'APELLIDO PATERNO']), materno: findCol(['MATERNO', 'APELLIDO MATERNO']),
                    telefono: findCol(['TELEFONO', 'CELULAR']), cct: findCol(['CLAVE CENTRO', 'CCT']), subsistema: findCol(['SUBSISTEMA']),
                    municipio: findCol(['MUNICIPIO']), funcion: findCol(['FUNCION']), nivel: findCol(['NIVEL EDUCATIVO', 'NIVEL']),
                    servicio: findCol(['SERVICIO', 'MODALIDAD']), folio: findCol(['FOLIO']), concluido: findCol(['CURSO CONCLUIDO', 'CONCLUIDO'])
                };

                const parsedData = filas.slice(1).map((fila, index) => {
                    const celdas = fila.split('\t');

                                        <button key={g.id} onClick={() => { setActiveDbId(db.id); setModoPersonal({...modoPersonal, grupoId: g.id}); setAppView('workspace'); }} className="p-6 border-2 border-gray-100 rounded-2xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 text-left flex justify-between items-center transition-all group bg-white">
                                            <div>
                                                <div className="inline-block px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold mb-3 border border-blue-100 uppercase tracking-wider">{db.info.estado} • {db.info.siglas}</div>
                                                <div className="font-bold text-gray-800 text-xl mb-2 group-hover:text-blue-700 transition-colors">{db.info.nombreCurso}</div>
                                                <div className="text-gray-500 flex items-center gap-2"><i className="fa-solid fa-users text-gray-400"></i> {g.nombre}</div>
                                            </div>
                                            <div className="bg-gray-50 w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-blue-600 transition-colors">
                                                <i className="fa-solid fa-arrow-right text-xl text-gray-400 group-hover:text-white transition-colors"></i>
                                            </div>
                                        </button>
                                    ))
                                })}
                            </div>
                            {basesDeDatos.every(db => db.grupos.filter(g => g.asesorId === modoPersonal.personalId || g.asesor === modoPersonal.personalName).length === 0) && (
                                <div className="text-center py-16">
                                    <i className="fa-regular fa-folder-open text-6xl text-gray-200 mb-4"></i>
                                    <h3 className="text-xl font-bold text-gray-400">Sin grupos asignados</h3>
                                    <p className="text-gray-400 mt-2">Actualmente no tienes grupos activos vinculados a tu cuenta en ningún proyecto.</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (appView === 'personal_dashboard') {
                return (
                    <div className="min-h-screen bg-gray-50 text-gray-800 font-sans pb-10">
                        <header className="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center no-print sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-users-viewfinder text-2xl text-yellow-400"></i>
                                <h1 className="text-xl font-bold">Portal de Personal</h1>
                            </div>
                            <button onClick={cerrarSesion} className="bg-white/10 border border-white/20 px-4 py-1.5 rounded-lg font-bold text-sm hover:bg-red-500 hover:border-red-500 transition-colors flex items-center gap-2">
                                <i className="fa-solid fa-right-from-bracket"></i> Salir
                            </button>
                        </header>

                        <div className="max-w-5xl mx-auto mt-10 p-8 bg-white rounded-3xl shadow-sm border border-gray-100">
                            <div className="text-center mb-10 border-b border-gray-100 pb-8">
                                <div className="bg-blue-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-blue-100">
                                    <i className="fa-solid fa-user-tie text-4xl text-blue-600"></i>
                                </div>
                                <h2 className="text-3xl font-black text-gray-800 mb-2">¡Hola, {modoPersonal.personalName}!</h2>
                                <p className="text-gray-500 text-lg">Selecciona un proyecto de tu matriz de asignaciones para ingresar.</p>
                            </div>
                            
                            <div className="space-y-10">
                                <div>
                                    <h3 className="font-black text-gray-400 uppercase tracking-widest text-sm mb-4 border-b pb-2"><i className="fa-solid fa-sitemap mr-2"></i> Tus asignaciones como Coordinador General</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {basesDeDatos.map(db => {
                                            const cIds = db.info.coordinadorIds || (db.info.coordinadorId ? [db.info.coordinadorId] : []);
                                            if (!cIds.includes(modoPersonal.personalId)) return null;
                                            return (
                                                <button key={`coord-${db.id}`} onClick={() => { setActiveDbId(db.id); setModoPersonal({...modoPersonal, roleInProject: 'coordinador', grupoId: null}); setAppView('workspace'); }} className="p-6 border-2 border-purple-100 rounded-2xl hover:border-purple-500 hover:shadow-lg hover:shadow-purple-500/10 text-left flex justify-between items-center transition-all group bg-white">
                                                    <div>
                                                        <div className="inline-block px-3 py-1 bg-purple-50 text-purple-600 rounded-full text-xs font-bold mb-3 border border-purple-100 uppercase tracking-wider">{db.info.estado} • {db.info.siglas}</div>
                                                        <div className="font-bold text-gray-800 text-xl mb-2 group-hover:text-purple-700 transition-colors">{db.info.nombreCurso}</div>
                                                        <div className="text-purple-500 flex items-center gap-2 font-bold text-xs"><i className="fa-solid fa-eye mr-1"></i> MODO LECTURA AUDITORÍA</div>
                                                    </div>
                                                    <div className="bg-gray-50 w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-purple-600 transition-colors">
                                                        <i className="fa-solid fa-arrow-right text-xl text-gray-400 group-hover:text-white transition-colors"></i>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                        {basesDeDatos.filter(db => (db.info.coordinadorIds || (db.info.coordinadorId ? [db.info.coordinadorId] : [])).includes(modoPersonal.personalId)).length === 0 && (
                                            <div className="text-gray-400 text-sm italic col-span-2">No tienes asignaciones como coordinador activo.</div>
                                        )}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-black text-gray-400 uppercase tracking-widest text-sm mb-4 border-b pb-2"><i className="fa-solid fa-users text-blue-500 mr-2"></i> Tus asignaciones como Asesor de Grupo</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {basesDeDatos.map(db => {
                                            const misGrupos = db.grupos.filter(g => g.asesorId === modoPersonal.personalId || g.asesor === modoPersonal.personalName); 
                                            if (misGrupos.length === 0) return null;
                                            
                                            return misGrupos.map(g => (
                                                <button key={`asesor-${g.id}`} onClick={() => { setActiveDbId(db.id); setModoPersonal({...modoPersonal, roleInProject: 'asesor', grupoId: g.id}); setAppView('workspace'); }} className="p-6 border-2 border-gray-100 rounded-2xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 text-left flex justify-between items-center transition-all group bg-white">
                                                    <div>
                                                        <div className="inline-block px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold mb-3 border border-blue-100 uppercase tracking-wider">{db.info.estado} • {db.info.siglas}</div>
                                                        <div className="font-bold text-gray-800 text-xl mb-2 group-hover:text-blue-700 transition-colors">{db.info.nombreCurso}</div>
                                                        <div className="text-gray-500 flex items-center gap-2"><i className="fa-solid fa-users text-gray-400"></i> {g.nombre}</div>
                                                    </div>
                                                    <div className="bg-gray-50 w-12 h-12 rounded-full flex items-center justify-center group-hover:bg-blue-600 transition-colors">
                                                        <i className="fa-solid fa-arrow-right text-xl text-gray-400 group-hover:text-white transition-colors"></i>
                                                    </div>
                                                </button>
                                            ))
                                        })}
                                        {basesDeDatos.every(db => db.grupos.filter(g => g.asesorId === modoPersonal.personalId || g.asesor === modoPersonal.personalName).length === 0) && (
                                            <div className="text-gray-400 text-sm italic col-span-2">No tienes asignaciones de grupos como asesor.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (appView === 'workspace') {
                return <Workspace db={dbActiva} appView={appView} setAppView={setAppView} asesoresGlobales={personalGlobal} setAsesoresGlobales={setPersonalGlobal} onUpdate={updateActiveDb} modoPersonal={modoPersonal} />;
            }
            
            return null;
        }

        // ==========================================
        // COMPONENTE WORKSPACE (V3.7 LÓGICA DE PERMISOS)
        // ==========================================
        function Workspace({ db, appView, setAppView, asesoresGlobales, setAsesoresGlobales, onUpdate, modoPersonal }) {
            const isPersonal = modoPersonal.activo;
            const isAsesor = isPersonal && modoPersonal.roleInProject === 'asesor';
            const isCoordinador = isPersonal && modoPersonal.roleInProject === 'coordinador';
            const isAdmin = !isPersonal;

            const [tab, setTab] = useState(isAdmin || isCoordinador ? 'resumen' : 'seguimiento'); 

            const handleVolver = () => {
                if (isPersonal) setAppView('personal_dashboard');
                else setAppView('admin_dashboard');
            };

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col font-sans text-sm">
                    <header className="bg-blue-900 text-white px-4 py-2 flex justify-between items-center shadow-md no-print">
                        <div className="flex items-center gap-4">
                            <button onClick={handleVolver} className="hover:text-gray-300 text-sm bg-blue-800 px-3 py-1.5 rounded-lg border border-blue-700 transition-colors shadow-inner flex items-center gap-2"><i className="fa-solid fa-arrow-left"></i> Volver al Panel</button>
                            <h1 className="text-lg font-bold">
                                {db.info.siglas}-{db.info.idEstado}-{db.info.anio}
                                {isAsesor && <span className="ml-3 text-yellow-300 bg-black/20 px-2 py-0.5 rounded text-sm"><i className="fa-solid fa-user-tie"></i> ASESOR: {db.grupos.find(g=>g.id===modoPersonal.grupoId)?.nombre}</span>}
                                {isCoordinador && <span className="ml-3 text-purple-300 bg-black/20 px-2 py-0.5 rounded text-sm"><i className="fa-solid fa-sitemap"></i> COORDINADOR GENERAL</span>}
                            </h1>
                        </div>
                        <div className="flex bg-blue-800/50 rounded-xl p-1 gap-1 font-medium border border-blue-700/50 overflow-x-auto">
                            {(isAdmin || isCoordinador) && <button onClick={()=>setTab('resumen')} className={`px-4 py-1.5 rounded-lg transition-colors whitespace-nowrap ${tab==='resumen'?'bg-white text-blue-900 shadow':'hover:bg-blue-700 text-blue-100'}`}><i className="fa-solid fa-chart-pie"></i> Resumen</button>}
                            
                            {isAdmin && <button onClick={()=>setTab('ajustes')} className={`px-4 py-1.5 rounded-lg transition-colors whitespace-nowrap ${tab==='ajustes'?'bg-white text-blue-900 shadow':'hover:bg-blue-700 text-blue-100'}`}><i className="fa-solid fa-gear"></i> Ajustes</button>}
                            {isAdmin && <button onClick={()=>setTab('grupos')} className={`px-4 py-1.5 rounded-lg transition-colors whitespace-nowrap ${tab==='grupos'?'bg-white text-blue-900 shadow':'hover:bg-blue-700 text-blue-100'}`}><i className="fa-solid fa-users"></i> Grupos</button>}
                            {isAdmin && <button onClick={()=>setTab('datos')} className={`px-4 py-1.5 rounded-lg transition-colors whitespace-nowrap ${tab==='datos'?'bg-white text-blue-900 shadow':'hover:bg-blue-700 text-blue-100'}`}><i className="fa-solid fa-table"></i> Asignar</button>}
                            
                            <button onClick={()=>setTab('seguimiento')} className={`px-4 py-1.5 rounded-lg transition-colors whitespace-nowrap ${tab==='seguimiento'?'bg-yellow-400 text-blue-900 font-bold shadow':'hover:bg-blue-700 text-blue-100'}`}><i className="fa-solid fa-list-check"></i> Seguimiento</button>
                            
                            {(isAdmin || isCoordinador) && <button onClick={()=>setTab('exportar')} className={`px-4 py-1.5 rounded-lg transition-colors whitespace-nowrap ${tab==='exportar'?'bg-white text-blue-900 shadow':'hover:bg-blue-700 text-blue-100'}`}><i className="fa-solid fa-download"></i> Exportar</button>}
                        </div>
                    </header>

                    <div className="flex-1 overflow-hidden flex flex-col p-3 print:p-0">
                        {tab === 'resumen' && (isAdmin || isCoordinador) && <TabResumen db={db} />}
                        {tab === 'ajustes' && isAdmin && <TabAjustes db={db} onUpdate={onUpdate} asesoresGlobales={asesoresGlobales} />}
                        {tab === 'grupos' && isAdmin && <TabGrupos db={db} onUpdate={onUpdate} asesoresGlobales={asesoresGlobales} />}
                        {tab === 'datos' && isAdmin && <TabDatos db={db} onUpdate={onUpdate} />}
                        {tab === 'exportar' && (isAdmin || isCoordinador) && <TabExportar db={db} onUpdate={onUpdate} isAdmin={isAdmin} isCoordinador={isCoordinador} />}
                        {tab === 'seguimiento' && <TabSeguimiento db={db} onUpdate={onUpdate} isAsesor={isAsesor} isCoordinador={isCoordinador} isAdmin={isAdmin} asesorGrupoId={modoPersonal.grupoId} />}
                    </div>
                </div>
            );
        }

        // --- PESTAÑAS RESUMEN Y AJUSTES ---
        function TabResumen({ db }) {
            const statsPorGrupo = useMemo(() => {
                const res = db.grupos.map(g => ({ ...g, total: 0, funciones: {} }));
                const sinGrupo = { id: 'NONE', nombre: 'Sin Asignar', asesor: '-', total: 0, funciones: {} };
                db.participantes.forEach(p => {
                    const group = res.find(g => g.id === p.grupoId) || sinGrupo;
                    group.total++;
                    const f = p.funcion || 'Sin Función';
                    group.funciones[f] = (group.funciones[f] || 0) + 1;
                });
                if(sinGrupo.total > 0) res.push(sinGrupo);
                return res;
            }, [db]);

            return (
                <div className="bg-white rounded-2xl shadow-sm h-full flex flex-col overflow-auto p-8">
                    <h2 className="font-bold text-2xl text-gray-800 mb-6 border-b pb-4"><i className="fa-solid fa-chart-pie text-blue-600"></i> Resumen de la Oferta</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100 flex items-center gap-5 shadow-sm">
                            <div className="bg-blue-600 text-white w-14 h-14 rounded-xl flex items-center justify-center"><i className="fa-solid fa-users text-2xl"></i></div>
                            <div><div className="text-sm text-gray-500 font-bold uppercase tracking-wider">Participantes</div><div className="text-4xl font-black text-blue-900">{db.participantes.length}</div></div>
                        </div>
                        <div className="bg-green-50 p-6 rounded-2xl border border-green-100 flex items-center gap-5 shadow-sm">
                            <div className="bg-green-600 text-white w-14 h-14 rounded-xl flex items-center justify-center"><i className="fa-solid fa-layer-group text-2xl"></i></div>
                            <div><div className="text-sm text-gray-500 font-bold uppercase tracking-wider">Grupos Creados</div><div className="text-4xl font-black text-green-900">{db.grupos.length}</div></div>
                        </div>
                        <div className="bg-purple-50 p-6 rounded-2xl border border-purple-100 flex items-center gap-5 shadow-sm">
                            <div className="bg-purple-600 text-white w-14 h-14 rounded-xl flex items-center justify-center"><i className="fa-solid fa-calendar-check text-2xl"></i></div>
                            <div><div className="text-sm text-gray-500 font-bold uppercase tracking-wider">Seguimientos</div><div className="text-4xl font-black text-purple-900">{db.semanasSeguimiento?.length || 0}</div></div>
                        </div>
                    </div>

                    <h3 className="font-bold text-lg text-gray-700 mb-4">Desglose Operativo por Grupo</h3>
                    <div className="overflow-auto border border-gray-200 rounded-xl shadow-sm">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-gray-50 text-gray-600 border-b border-gray-200">
                                <tr><th className="p-4 font-bold">Grupo</th><th className="p-4 font-bold">Asesor Titular</th><th className="p-4 text-center font-bold">Volumen</th><th className="p-4 font-bold">Desglose de Funciones</th></tr>
                            </thead>
                            <tbody>
                                {statsPorGrupo.map((g, i) => (
                                    <tr key={i} className="border-b border-gray-50 hover:bg-gray-50/50">
                                        <td className="p-4 font-bold text-gray-800">{g.nombre}</td>
                                        <td className="p-4 text-gray-600">{g.asesor}</td>
                                        <td className="p-4 text-center"><span className="bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-full text-xs">{g.total}</span></td>
                                        <td className="p-4">
                                            <div className="flex flex-wrap gap-2">
                                                {Object.entries(g.funciones).map(([f, count]) => (
                                                    <span key={f} className="bg-white border border-gray-200 px-2.5 py-1 rounded-lg text-xs shadow-sm"><strong className="text-blue-700">{count}</strong> <span className="text-gray-500">|</span> {f}</span>
                                                ))}
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function TabAjustes({ db, onUpdate, asesoresGlobales }) {
            const [info, setInfo] = useState({ ...db.info });
            
            useEffect(() => {
                if (!info.coordinadorIds) {
                    setInfo(prev => ({...prev, coordinadorIds: prev.coordinadorId ? [prev.coordinadorId] : [] }));
                }
            }, []);

            const guardarCambios = () => { onUpdate({ ...db, info }); alert("Ajustes guardados correctamente"); };
            
            return (
                <div className="bg-white rounded-2xl shadow-sm h-full flex flex-col p-8 max-w-4xl mx-auto w-full overflow-auto">
                    <div className="flex justify-between mb-6 border-b pb-4"><h2 className="font-bold text-xl text-gray-800"><i className="fa-solid fa-gear text-blue-600 mr-2"></i> Edición de Configuración de la Oferta</h2><button onClick={guardarCambios} className="bg-blue-600 text-white px-6 py-2 rounded-xl shadow-md hover:bg-blue-700 font-bold transition-colors">Guardar Cambios</button></div>
                    <div className="grid grid-cols-2 gap-5">
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Sector Formativo</label><select className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={SECTORES_FORMATIVOS.includes(info.sectorFormativo || '') ? info.sectorFormativo : 'Otros'} onChange={e=>setInfo({...info, sectorFormativo: e.target.value !== 'Otros' ? e.target.value : ''})}>
                            {SECTORES_FORMATIVOS.map(op => <option key={op} value={op}>{op}</option>)}
                        </select></div>
                        {(!SECTORES_FORMATIVOS.includes(info.sectorFormativo || '')) && (
                            <div className="col-span-2">
                                <label className="block text-xs font-bold text-gray-600 mb-1">Especificar otro sector</label>
                                <input type="text" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={info.sectorFormativo || ''} onChange={e=>setInfo({...info, sectorFormativo: e.target.value})} placeholder="Describe el sector" />
                            </div>
                        )}
                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-600 mb-1">Tipo de Formación</label><select className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={info.tipoFormacion} onChange={e=>setInfo({...info, tipoFormacion:e.target.value})}>{TIPOS_FORMACION.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-600 mb-1">Nombre Completo del Curso</label><textarea className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" rows="2" value={info.nombreCurso} onChange={e=>setInfo({...info, nombreCurso:e.target.value})}></textarea></div>
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Año</label><input type="text" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={info.anio} onChange={e=>setInfo({...info, anio:e.target.value})} /></div>
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Siglas</label><input type="text" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg uppercase outline-none focus:border-blue-500" value={info.siglas} onChange={e=>setInfo({...info, siglas:e.target.value})} /></div>
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Contraseña Moodle Predeterminada</label><input type="text" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={info.moodlePass} onChange={e=>setInfo({...info, moodlePass:e.target.value})} /></div>
                        
                        {/* V3.0 Restaurado Horas y Modalidad */}
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Horas</label><input type="number" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={info.horas || ''} onChange={e=>setInfo({...info, horas: e.target.value})} /></div>
                        <div>
                            <label className="block text-xs font-bold text-gray-600 mb-1">Modalidad</label>
                            <select className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500" value={info.modalidad || 'A distancia'} onChange={e=>setInfo({...info, modalidad: e.target.value})}>
                                <option value="A distancia">A distancia</option>
                                <option value="Mixta">Mixta</option>
                                <option value="Presencial">Presencial</option>
                            </select>
                        </div>

                        <div className="col-span-2">
                            <label className="block text-xs font-bold text-purple-600 mb-1">Coordinadores del Proyecto</label>
                            <div className="border border-purple-200 rounded-lg p-2 max-h-32 overflow-y-auto bg-purple-50/30 text-sm">
                                {asesoresGlobales.map(p => (
                                    <label key={p.id} className="flex items-center gap-2 mb-1 p-1 hover:bg-white rounded cursor-pointer">
                                        <input type="checkbox" className="w-4 h-4 text-purple-600 rounded focus:ring-purple-500"
                                            checked={info.coordinadorIds?.includes(p.id)}
                                            onChange={(e) => {
                                                const newIds = e.target.checked
                                                    ? [...(info.coordinadorIds||[]), p.id]
                                                    : (info.coordinadorIds||[]).filter(id => id !== p.id);
                                                setInfo({...info, coordinadorIds: newIds});
                                            }}
                                        /> 
                                        <span className="text-gray-700 font-semibold">{p.nombre}</span>
                                    </label>
                                ))}
                                {asesoresGlobales.length === 0 && <span className="text-gray-400 italic">No hay personal registrado</span>}
                            </div>
                        </div>

                        <div className="col-span-2 border-t pt-4 mt-2"><h3 className="font-black text-sm text-blue-800 uppercase tracking-wide">Estructura para Seguimiento Semanal</h3><p className="text-xs text-gray-500 mb-3">Modifica esto si necesitas expandir la matriz de seguimiento actual.</p></div>
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Número de Sesiones</label><input type="number" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none" value={info.numSesiones} onChange={e=>setInfo({...info, numSesiones:parseInt(e.target.value)})} /></div>
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Número de Productos de Aprendizaje (PA)</label><input type="number" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none" value={info.numPA} onChange={e=>setInfo({...info, numPA:parseInt(e.target.value)})} /></div>
                        <div><label className="block text-xs font-bold text-gray-600 mb-1">Número de Actividades (ACT)</label><input type="number" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none" value={info.numAct} onChange={e=>setInfo({...info, numAct:parseInt(e.target.value)})} /></div>
                        <div>
                            <label className="block text-xs font-bold text-gray-600 mb-1">Cálculo de CALIF. FINAL</label>
                            <select className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none" value={getCalculoFinalTipo(info)} onChange={e=>setInfo({...info, calculoFinalTipo: e.target.value})}>

                            <input type="number" className="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none" value={info.acreditacion ?? 80} onChange={e=>setInfo({...info, acreditacion: parseInt(e.target.value) || 80})} />
                        </div>

        // --- PESTAÑAS GRUPOS, DATOS, EXPORTAR ---
        function TabGrupos({ db, onUpdate, asesoresGlobales }) {
            const [n, setN] = useState({ nombre: '', asesorId: '', asesor: '', contacto: '', dia: '', hora: '', whatsapp: '' });
            const [editingGroup, setEditingGroup] = useState(null);
            const [groupEditData, setGroupEditData] = useState(null);

            const add = () => { 
                if(!n.nombre) return alert("Falta el nombre del grupo");
                if(!n.asesorId) return alert("Debes seleccionar a una persona de la lista de Personal Global");
                onUpdate({ ...db, grupos: [...db.grupos, {...n, id: Date.now().toString()}] }); 
                setN({ nombre: '', asesorId: '', asesor: '', contacto: '', dia: '', hora: '', whatsapp: '' }); 
            };
            const del = (id) => onUpdate({ ...db, grupos: db.grupos.filter(g => g.id !== id), participantes: db.participantes.map(p => p.grupoId === id ? { ...p, grupoId: null } : p) });
            const openEditGroup = (group) => {
                setEditingGroup(group.id);
                setGroupEditData({ ...group });
            };
            const closeEditGroup = () => {
                setEditingGroup(null);
                setGroupEditData(null);
            };
            const saveGroupChanges = () => {
                if (!groupEditData || !groupEditData.nombre) return alert('El nombre del grupo es obligatorio.');
                if (!groupEditData.asesorId) return alert('Selecciona un asesor para el grupo.');
                const asesor = asesoresGlobales.find(a => a.id === groupEditData.asesorId)?.nombre || '';
                const updatedGroups = db.grupos.map(g => g.id === groupEditData.id ? { ...g, ...groupEditData, asesor } : g);
                onUpdate({ ...db, grupos: updatedGroups });
                closeEditGroup();
            };
            
            return (
                <div className="bg-white rounded-2xl shadow-sm h-full flex flex-col overflow-hidden">
                    <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h2 className="font-bold text-xl text-gray-800"><i className="fa-solid fa-users text-blue-600 mr-2"></i> Gestión de Grupos de Trabajo</h2>
                        <div className="text-xs text-gray-500 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200"><i className="fa-solid fa-info-circle mr-1"></i>Para agregar nuevo personal, ve al Panel Administrador.</div>
                    </div>
                    <div className="p-6 bg-gray-50/50 border-b border-gray-200 grid grid-cols-6 gap-4 items-end">
                        <div><label className="block text-xs font-bold text-gray-700 mb-1">Grupo (Ej. GRUPO 01)</label><input type="text" className="w-full p-2.5 border border-gray-300 bg-white rounded-lg text-sm uppercase focus:border-blue-500 outline-none" value={n.nombre} onChange={e=>setN({...n, nombre: e.target.value})} /></div>
                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-700 mb-1">Asesor Titular (Personal Global)</label>
                            <select className="w-full p-2.5 border border-gray-300 bg-white rounded-lg text-sm focus:border-blue-500 outline-none" value={n.asesorId} onChange={e=>{
                                const as = asesoresGlobales.find(a=>a.id === e.target.value);
                                setN({...n, asesorId: as ? as.id : '', asesor: as ? as.nombre : ''});
                            }}>
                                <option value="">-- Seleccionar Asesor --</option>
                                {asesoresGlobales.map(a => <option key={a.id} value={a.id}>{a.nombre}</option>)}
                            </select>
                        </div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1">Día</label><input type="text" className="w-full p-2.5 border border-gray-300 bg-white rounded-lg text-sm focus:border-blue-500 outline-none" value={n.dia} onChange={e=>setN({...n, dia: e.target.value})} /></div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1">Turno / Hora</label><input type="text" className="w-full p-2.5 border border-gray-300 bg-white rounded-lg text-sm focus:border-blue-500 outline-none" value={n.hora} onChange={e=>setN({...n, hora: e.target.value})} /></div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1">Enlace WhatsApp</label><div className="flex gap-2"><input type="text" className="w-full p-2.5 border border-gray-300 bg-white rounded-lg text-sm flex-1 focus:border-blue-500 outline-none" value={n.whatsapp} onChange={e=>setN({...n, whatsapp: e.target.value})} /><button onClick={add} className="bg-blue-600 text-white px-4 py-2.5 rounded-lg shadow hover:bg-blue-700 font-bold transition-transform active:scale-95"><i className="fa-solid fa-plus"></i></button></div></div>
                    </div>
                    <div className="flex-1 overflow-auto">
                        <table className="w-full text-sm text-left whitespace-nowrap">
                            <thead className="bg-white sticky top-0 shadow-sm z-10"><tr><th className="p-4 text-gray-500">Grupo</th><th className="p-4 text-gray-500">Asesor</th><th className="p-4 text-gray-500">Día / Hora</th><th className="p-4 text-gray-500">WhatsApp</th><th className="p-4 text-gray-500 text-center">Acción</th></tr></thead>
                            <tbody>
                                {db.grupos.map(g => (
                                    <tr key={g.id} className="border-b border-gray-50 hover:bg-blue-50/50 transition-colors">
                                        <td className="p-4 font-bold text-gray-800">{g.nombre}</td>
                                        <td className="p-4 text-blue-700 font-semibold">{g.asesor}</td>
                                        <td className="p-4 text-gray-600">{g.dia} - {g.hora}</td>
                                        <td className="p-4 text-blue-500 truncate max-w-xs">{g.whatsapp}</td>
                                        <td className="p-4 text-center flex items-center justify-center gap-2">
                                            <button onClick={() => openEditGroup(g)} className="text-gray-400 hover:text-blue-600 w-8 h-8 rounded-lg hover:bg-blue-50 transition-colors"><i className="fa-solid fa-pen"></i></button>
                                            <button onClick={()=>del(g.id)} className="text-gray-400 hover:text-red-500 w-8 h-8 rounded-lg hover:bg-red-50 transition-colors"><i className="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                ))}
                                {db.grupos.length === 0 && <tr><td colSpan="5" className="text-center py-10 text-gray-400">No hay grupos creados para este proyecto.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    {editingGroup && groupEditData && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-3xl p-6 overflow-auto max-h-[90vh]">
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-gray-900">Editar Grupo de Trabajo</h3>
                                        <p className="text-sm text-gray-500">Actualiza los datos del grupo y del asesor asignado.</p>
                                    </div>
                                    <button onClick={closeEditGroup} className="text-gray-500 hover:text-gray-900"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Grupo</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={groupEditData.nombre || ''} onChange={e => setGroupEditData({ ...groupEditData, nombre: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Asesor Titular</label>
                                        <select className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={groupEditData.asesorId || ''} onChange={e => {
                                            const selected = asesoresGlobales.find(a => a.id === e.target.value);
                                            setGroupEditData({ ...groupEditData, asesorId: selected?.id || '', asesor: selected?.nombre || '' });
                                        }}>
                                            <option value="">-- Seleccionar Asesor --</option>
                                            {asesoresGlobales.map(a => <option key={a.id} value={a.id}>{a.nombre}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Día</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={groupEditData.dia || ''} onChange={e => setGroupEditData({ ...groupEditData, dia: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Turno / Hora</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={groupEditData.hora || ''} onChange={e => setGroupEditData({ ...groupEditData, hora: e.target.value })} />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Enlace WhatsApp</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={groupEditData.whatsapp || ''} onChange={e => setGroupEditData({ ...groupEditData, whatsapp: e.target.value })} />
                                    </div>
                                </div>
                                <div className="mt-6 flex justify-end gap-3">
                                    <button onClick={closeEditGroup} className="px-5 py-3 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-colors">Cancelar</button>
                                    <button onClick={saveGroupChanges} className="px-5 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors">Guardar cambios</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TabDatos({ db, onUpdate }) {
            const [filtros, setFiltros] = useState({ municipio: '', funcion: '', nivel: '', grupo: 'ALL' });
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [grupoAsignar, setGrupoAsignar] = useState('');
            const [duplicateGroups, setDuplicateGroups] = useState([]);
            const [editingParticipant, setEditingParticipant] = useState(null);
            const [editData, setEditData] = useState(null);

            const municipiosUnicos = useMemo(() => [...new Set(db.participantes.map(p => p.municipio).filter(Boolean))].sort(), [db.participantes]);

            const detectDuplicates = () => {
                const curpMap = {};
                const correoMap = {};

                db.participantes.forEach(p => {
                    const curpKey = normalizeText(p.curp || '');
                    if (curpKey) curpMap[curpKey] = [...(curpMap[curpKey] || []), p];
                    const correoKey = (p.correo || '').trim().toLowerCase();
                    if (correoKey) correoMap[correoKey] = [...(correoMap[correoKey] || []), p];
                });

                const duplicates = [];
                Object.entries(curpMap).filter(([, items]) => items.length > 1).forEach(([key, items]) => {
                    duplicates.push({ type: 'CURP', key, items });
                });
                Object.entries(correoMap).filter(([, items]) => items.length > 1).forEach(([key, items]) => {
                    duplicates.push({ type: 'CORREO', key, items });
                });

                setDuplicateGroups(duplicates);
            };

            const openEditParticipant = (participant) => {
                setEditingParticipant(participant);
                setEditData({ ...participant, grupoId: participant.grupoId || '' });
            };

            const closeEditModal = () => {
                setEditingParticipant(null);
                setEditData(null);
            };

            const saveParticipantEdits = () => {
                if (!editData) return;

                const newList = db.participantes.map(p => p.id === editData.id ? {
                    ...p,
                    ...editData,
                    completo: `${editData.paterno || ''} ${editData.materno || ''} ${editData.nombre || ''}`.trim()
                } : p);

                onUpdate({ ...db, participantes: newList });
                closeEditModal();
            };

            const deleteParticipant = (id) => {
                if (!confirm('¿Eliminar este participante? Esta acción no se puede deshacer.')) return;
                onUpdate({ ...db, participantes: db.participantes.filter(p => p.id !== id) });
                setSelectedIds(prev => { const next = new Set(prev); next.delete(id); return next; });
                setDuplicateGroups(prev => prev.map(group => ({ ...group, items: group.items.filter(p => p.id !== id) })).filter(group => group.items.length > 1));
            };
            const funcionesUnicas = useMemo(() => [...new Set(db.participantes.map(p => p.funcion).filter(Boolean))].sort(), [db.participantes]);
            const nivelesUnicos = useMemo(() => [...new Set(db.participantes.map(p => p.nivel).filter(Boolean))].sort(), [db.participantes]);

            const participantesFiltrados = useMemo(() => {
                return db.participantes.filter(p => {
                    if (filtros.municipio && p.municipio !== filtros.municipio) return false;
                    if (filtros.funcion && p.funcion !== filtros.funcion) return false;
                    if (filtros.nivel && p.nivel !== filtros.nivel) return false;
                    if (filtros.grupo === 'NONE' && p.grupoId) return false;
                    if (filtros.grupo !== 'ALL' && filtros.grupo !== 'NONE' && p.grupoId !== filtros.grupo) return false;
                    return true;
                });
            }, [db.participantes, filtros]);

            const toggleSelectAll = () => {
                if (selectedIds.size === participantesFiltrados.length && participantesFiltrados.length > 0) setSelectedIds(new Set());
                else setSelectedIds(new Set(participantesFiltrados.map(p => p.id)));
            };
            const toggleSelect = (id) => {
                const newSet = new Set(selectedIds);
                if (newSet.has(id)) newSet.delete(id); else newSet.add(id);
                setSelectedIds(newSet);
            };

            const aplicarGrupoMasivo = () => {
                if (!grupoAsignar) return alert("Selecciona un grupo primero");
                const nuevosParticipantes = db.participantes.map(p => selectedIds.has(p.id) ? { ...p, grupoId: grupoAsignar } : p);
                onUpdate({ ...db, participantes: nuevosParticipantes });
                setSelectedIds(new Set()); 
            };

            return (
                <div className="bg-white rounded-2xl shadow-sm h-full flex flex-col overflow-hidden">
                    <div className="p-4 border-b border-gray-100 bg-white flex gap-4 items-center flex-wrap">
                        <div className="font-bold text-gray-800 flex items-center gap-2 mr-2"><i className="fa-solid fa-filter text-blue-500"></i> Filtros:</div>
                        <select className="p-2 border border-gray-200 bg-gray-50 rounded-lg text-sm w-48 focus:border-blue-500 outline-none" value={filtros.grupo} onChange={e=>setFiltros({...filtros, grupo: e.target.value})}>
                            <option value="ALL">Todos los Grupos</option>
                            <option value="NONE" className="font-bold text-red-500">-- SIN ASIGNAR --</option>
                            {db.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre}</option>)}
                        </select>
                        <select className="p-2 border border-gray-200 bg-gray-50 rounded-lg text-sm w-48 focus:border-blue-500 outline-none" value={filtros.municipio} onChange={e=>setFiltros({...filtros, municipio: e.target.value})}>
                            <option value="">Todos (Municipios)</option>
                            {municipiosUnicos.map(m => <option key={m} value={m}>{m}</option>)}
                        </select>
                        <select className="p-2 border border-gray-200 bg-gray-50 rounded-lg text-sm w-48 focus:border-blue-500 outline-none" value={filtros.funcion} onChange={e=>setFiltros({...filtros, funcion: e.target.value})}>
                            <option value="">Todas (Funciones)</option>
                            {funcionesUnicas.map(f => <option key={f} value={f}>{f}</option>)}
                        </select>
                        <select className="p-2 border border-gray-200 bg-gray-50 rounded-lg text-sm w-48 focus:border-blue-500 outline-none" value={filtros.nivel} onChange={e=>setFiltros({...filtros, nivel: e.target.value})}>
                            <option value="">Todos (Niveles)</option>
                            {nivelesUnicos.map(n => <option key={n} value={n}>{n}</option>)}
                        </select>
                        <button onClick={() => setFiltros({municipio:'', funcion:'', nivel:'', grupo:'ALL'})} className="text-sm text-blue-600 hover:text-blue-800 font-semibold px-2">Limpiar Filtros</button>
                        <button onClick={detectDuplicates} className="text-sm text-yellow-700 bg-yellow-100 border border-yellow-200 rounded-lg px-3 py-1.5 font-bold hover:bg-yellow-200 transition-colors">Detectar duplicados</button>
                        {duplicateGroups.length > 0 && <button onClick={() => setDuplicateGroups([])} className="text-sm text-gray-600 bg-white border border-gray-200 rounded-lg px-3 py-1.5 font-semibold hover:bg-gray-100 transition-colors">Limpiar duplicados</button>}
                    </div>

                    {selectedIds.size > 0 && (
                        <div className="p-3 bg-blue-600 border-b flex items-center justify-between shadow-sm text-white">
                            <div className="font-bold text-sm px-3">{selectedIds.size} participantes seleccionados listos para asignar.</div>
                            <div className="flex gap-2">
                                <select className="p-2 border-none bg-white text-gray-800 rounded-lg text-sm font-semibold outline-none" value={grupoAsignar} onChange={e=>setGrupoAsignar(e.target.value)}>
                                    <option value="">-- Seleccionar Grupo Destino --</option>
                                    {db.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre} ({g.asesor})</option>)}
                                </select>
                                <button onClick={aplicarGrupoMasivo} className="bg-green-500 hover:bg-green-400 text-white px-5 py-2 rounded-lg text-sm font-bold shadow transition-colors">Aplicar Grupo</button>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 overflow-auto relative bg-gray-50">
                        <table className="w-full text-xs text-left whitespace-nowrap">
                            <thead className="bg-white sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th className="p-3 text-center w-10 border-b border-gray-100"><input type="checkbox" className="w-4 h-4" checked={selectedIds.size > 0 && selectedIds.size === participantesFiltrados.length} onChange={toggleSelectAll} /></th>
                                    <th className="p-3 border-b border-gray-100 text-blue-800 font-bold">GRUPO ASIGNADO</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">NO.</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">CURP</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">NOMBRE COMPLETO</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">MUNICIPIO</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">FUNCIÓN</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">NIVEL</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">CORREO</th>
                                    <th className="p-3 border-b border-gray-100 font-semibold text-gray-500">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                {participantesFiltrados.map(p => {
                                    const grupoObj = db.grupos.find(g => g.id === p.grupoId);
                                    return (
                                        <tr key={p.id} className={`border-b border-gray-100 hover:bg-blue-50/50 transition-colors ${selectedIds.has(p.id) ? 'bg-blue-100/50' : 'bg-white'}`}>
                                            <td className="p-3 text-center"><input type="checkbox" className="w-4 h-4" checked={selectedIds.has(p.id)} onChange={() => toggleSelect(p.id)} /></td>
                                            <td className="p-3 font-bold text-blue-700">{grupoObj ? grupoObj.nombre : <span className="text-red-400 bg-red-50 px-2 py-0.5 rounded text-[10px]">Sin grupo</span>}</td>
                                            <td className="p-3 text-gray-500">{p.no}</td>
                                            <td className="p-3 font-mono text-[10px] text-gray-500">{p.curp}</td>
                                            <td className="p-3 font-semibold text-gray-800">{p.completo}</td>
                                            <td className="p-3 text-gray-600">{p.municipio}</td>
                                            <td className="p-3 text-gray-600">{p.funcion}</td>
                                            <td className="p-3 text-gray-600">{p.nivel}</td>
                                            <td className="p-3 text-gray-600">{p.correo}</td>
                                            <td className="p-3 flex gap-2">
                                                <button onClick={() => openEditParticipant(p)} className="px-2 py-1 bg-blue-600 text-white rounded-lg text-[11px] font-semibold hover:bg-blue-700">Editar</button>
                                                <button onClick={() => deleteParticipant(p.id)} className="px-2 py-1 bg-red-100 text-red-700 rounded-lg text-[11px] font-semibold hover:bg-red-200">Eliminar</button>
                                            </td>
                                        </tr>
                                    )
                                })}
                            </tbody>
                        </table>
                    </div>
                    <div className="p-3 bg-white border-t border-gray-200 text-xs text-gray-500 text-center font-medium shadow-inner">
                        Mostrando {participantesFiltrados.length} registros de {db.participantes.length} en total.
                    </div>

                    {duplicateGroups.length > 0 && (
                        <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-2xl space-y-4">
                            <div className="flex items-center justify-between gap-4">
                                <div className="font-bold text-yellow-800">Duplicados detectados</div>
                                <button onClick={() => setDuplicateGroups([])} className="text-sm text-gray-600 bg-white border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-100 transition-colors">Ocultar duplicados</button>
                            </div>
                            {duplicateGroups.map((group, idx) => (
                                <div key={`dup-group-${idx}`} className="bg-white border border-yellow-100 rounded-xl p-3">
                                    <div className="text-sm font-semibold text-yellow-900">{group.type}: {group.key} ({group.items.length})</div>
                                    <div className="mt-2 grid grid-cols-1 md:grid-cols-3 gap-2 text-xs text-gray-700">
                                        {group.items.map(item => (
                                            <div key={item.id} className="rounded-lg p-2 border border-yellow-200 bg-yellow-50">
                                                <div className="font-bold text-gray-800 truncate">{item.completo}</div>
                                                <div className="text-[10px] font-mono text-gray-500">CURP: {item.curp}</div>
                                                <div className="text-[10px] text-gray-500 truncate">Correo: {item.correo || '-'}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {editingParticipant && editData && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-3xl p-6 overflow-auto max-h-[90vh]">
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-gray-900">Editar Participante</h3>
                                        <p className="text-sm text-gray-500">Actualiza los datos y guarda los cambios.</p>
                                    </div>
                                    <button onClick={closeEditModal} className="text-gray-500 hover:text-gray-900"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">CURP</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.curp || ''} onChange={e => setEditData({ ...editData, curp: e.target.value })} />

                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Correo</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.correo || ''} onChange={e => setEditData({ ...editData, correo: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Nombre</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.nombre || ''} onChange={e => setEditData({ ...editData, nombre: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Apellido Paterno</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.paterno || ''} onChange={e => setEditData({ ...editData, paterno: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Apellido Materno</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.materno || ''} onChange={e => setEditData({ ...editData, materno: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Municipio</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.municipio || ''} onChange={e => setEditData({ ...editData, municipio: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Función</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.funcion || ''} onChange={e => setEditData({ ...editData, funcion: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Nivel</label>
                                        <input className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.nivel || ''} onChange={e => setEditData({ ...editData, nivel: e.target.value })} />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Grupo asignado</label>
                                        <select className="w-full p-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-500" value={editData.grupoId || ''} onChange={e => setEditData({ ...editData, grupoId: e.target.value })}>
                                            <option value="">-- Sin grupo --</option>
                                            {db.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre}</option>)}
